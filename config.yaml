hh:
  user_agent: "HHVacancyAssistant/1.0"
  rate_limit:
    qps: 2
    burst: 5
  search:
    # Вакансии с этими словами в названии пропускаются
    exclude_keywords:
      - "1C"
      - "junior"
      - "intern"
      - "стажёр"
    # Регионы: 1=Москва, 2=Санкт-Петербург, 113=Россия
    area:
      - 1
      - 2
    # remote, fullDay, shift, flexible
    schedule:
      - "remote"
      - "fullDay"
    # full, part, project, volunteer, probation
    employment:
      - "full"
    # Вакансии опубликованные за последние N часов
    published_within_hours: 24
    # Максимум вакансий за один запуск
    max_vacancies_per_run: 200
    # Дневной лимит откликов (hh.ru ограничивает ~200/день)
    daily_apply_limit: 200

storage:
  sqlite_path: "/data/bot.sqlite"
  retention_days: 30
