services:
  hh-assistant:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: hh-assistant
    restart: unless-stopped

    env_file:
      - .env

    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    volumes:
      # Именованный том — данные сохраняются между деплоями независимо от workspace
      - hh_data:/data
      # config.yaml берётся из репо, монтируется read-only
      - ./config.yaml:/app/config.yaml:ro

    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hh_data:
    name: hh_data
