# =============================================================================
# application-dev.properties — Профиль разработки
# Переопределяет значения из application.properties для локального запуска.
# =============================================================================

# Используем dev-сервисы Quarkus (auto-start PostgreSQL через Testcontainers)
%dev.quarkus.datasource.devservices.enabled=true
%dev.quarkus.datasource.devservices.port=5432
%dev.quarkus.datasource.devservices.image-name=postgres:17-alpine

%dev.quarkus.log.level=DEBUG
%dev.quarkus.log.console.json=false

%dev.hh.search.poll-interval-seconds=10
%dev.storage.retention-days=7
%dev.quarkus.otel.enabled=false

# В dev режиме telegram токен можно не задавать — бот не запустится, но приложение стартует
%dev.telegram.bot-token=${TELEGRAM_BOT_TOKEN:dev_placeholder_token}
