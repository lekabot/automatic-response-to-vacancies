# =============================================================================
# application.properties — Production конфигурация
# Все секреты передаются через переменные окружения.
# =============================================================================

# ─── Quarkus ─────────────────────────────────────────────────────────────────
quarkus.application.name=hh-vacancy-assistant
quarkus.application.version=1.0.0

# ─── Database ─────────────────────────────────────────────────────────────────
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hhassistant}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.acquisition-timeout=30S
quarkus.datasource.jdbc.idle-removal-interval=5M

# ─── Flyway ───────────────────────────────────────────────────────────────────
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.validate-on-migrate=true

# ─── jOOQ ─────────────────────────────────────────────────────────────────────
quarkus.jooq.dialect=POSTGRES

# ─── Telegram ─────────────────────────────────────────────────────────────────
telegram.bot-token=${TELEGRAM_BOT_TOKEN}
telegram.long-poll-timeout-seconds=30
telegram.updates-limit=100
telegram.connect-timeout-seconds=15
telegram.read-timeout-seconds=65

# ─── HH.ru ────────────────────────────────────────────────────────────────────
hh.user-agent=HHVacancyAssistant-Java/1.0
hh.rate-limit.qps=2.0
hh.rate-limit.burst=5

# Глобальные стоп-слова: пустой список по умолчанию (переопределяется в конкретной среде)
hh.search.exclude-keywords=
hh.search.published-within-hours=24
hh.search.max-vacancies-per-run=200
hh.search.daily-apply-limit=200
hh.search.poll-interval-seconds=60
hh.search.poll-interval-max-seconds=300
hh.search.same-result-backoff-enabled=true
hh.search.vacancy-lease-minutes=10
hh.search.heartbeat-every=10
hh.search.apply-total-timeout-seconds=120
hh.search.apply-per-attempt-timeout-seconds=35
hh.search.area=1,2
hh.search.schedule=remote,fullDay
hh.search.employment=full

# ─── Storage ──────────────────────────────────────────────────────────────────
storage.retention-days=30

# ─── Health / readiness ───────────────────────────────────────────────────────
quarkus.smallrye-health.root-path=/health
quarkus.smallrye-health.liveness-path=/health/live
quarkus.smallrye-health.readiness-path=/health/ready

# ─── Metrics ──────────────────────────────────────────────────────────────────
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics

# ─── OpenTelemetry ────────────────────────────────────────────────────────────
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.enabled=${OTEL_ENABLED:false}

# ─── Logging ──────────────────────────────────────────────────────────────────
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.console.json=true
quarkus.log.console.json.fields.mdc.enabled=true

# ─── HTTP (только для health/metrics) ────────────────────────────────────────
quarkus.http.port=8080
quarkus.http.host=0.0.0.0
# Отключаем RESTEasy dev UI в production
%prod.quarkus.dev-ui.enabled=false
