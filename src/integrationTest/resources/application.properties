# Конфигурация для integration-тестов
# Quarkus DevServices запустит PostgreSQL автоматически через Testcontainers
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.image-name=postgres:17-alpine

# Быстрый старт тестов
quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-at-start=false

# Заглушки для обязательных переменных окружения
telegram.bot-token=test_token_placeholder
quarkus.otel.enabled=false
quarkus.scheduler.enabled=false

# HH config (обязательные поля)
hh.user-agent=HHVacancyAssistant-Test/1.0
hh.rate-limit.qps=10.0
hh.rate-limit.burst=20
hh.search.exclude-keywords=
hh.search.area=1
hh.search.schedule=remote
hh.search.employment=full
hh.search.published-within-hours=24
hh.search.max-vacancies-per-run=50
hh.search.daily-apply-limit=10
hh.search.poll-interval-seconds=3600
hh.search.poll-interval-max-seconds=3600
hh.search.same-result-backoff-enabled=false
hh.search.vacancy-lease-minutes=5
hh.search.heartbeat-every=10
hh.search.apply-total-timeout-seconds=30
hh.search.apply-per-attempt-timeout-seconds=10
storage.retention-days=30

# Логирование
quarkus.log.level=WARN
quarkus.log.console.json=false
