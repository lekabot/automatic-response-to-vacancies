name: Native Image Build (Optional)

# Native build запускается только вручную или при пуше тега v*-native
# Не входит в стандартный main-build pipeline — слишком дорого
on:
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: 'Push native image to GHCR?'
        required: false
        default: 'false'
        type: boolean
  push:
    tags:
      - 'v*-native'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-native:
    name: GraalVM Native Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'graalvm'  # GraalVM для native compilation

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-native-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}

      - name: Build native image
        run: ./gradlew build -Dquarkus.package.type=native \
          -x test -x integrationTest -x contractTest --no-daemon
        timeout-minutes: 40

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: inputs.push_to_registry == 'true' || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.native
          push: ${{ inputs.push_to_registry == 'true' || startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:native-${{ github.sha }}
          cache-from: type=gha,scope=native
          cache-to: type=gha,scope=native,mode=max
