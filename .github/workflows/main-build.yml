name: Main Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-build
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Unit + Integration тесты ──────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Integration tests (Testcontainers + PostgreSQL)
        run: ./gradlew integrationTest --no-daemon

      - name: Contract tests
        run: ./gradlew contractTest --no-daemon

      - name: JaCoCo coverage report
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Enforce 90% coverage gate
        run: ./gradlew jacocoTestCoverageVerification --no-daemon

      - name: Upload coverage to artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco/
          retention-days: 30

  # ── Mutation тесты (только для critical modules) ──────────────────────────
  mutation-test:
    name: Mutation Tests (PIT)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
      - name: Run PIT mutation tests
        run: ./gradlew pitest --no-daemon
      - name: Upload PIT report
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: build/reports/pitest/
          retention-days: 30

  # ── JVM Docker Image ──────────────────────────────────────────────────────
  build-jvm-image:
    name: Build JVM Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}

      - name: Build Quarkus application
        run: ./gradlew quarkusBuild -Dquarkus.package.type=fast-jar \
          -x test -x integrationTest -x contractTest --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=HH Vacancy Assistant
            org.opencontainers.image.description=Telegram bot for hh.ru auto-apply

      - name: Build and push JVM image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image digest
        run: echo "Image digest: ${{ steps.build.outputs.digest }}"

  # ── Деплой ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: [self-hosted, linux, x64]
    needs: build-jvm-image
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR on server
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull latest image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Write .env
        run: |
          cat > ${{ vars.DEPLOY_PATH }}/.env << 'EOF'
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_USER=${{ vars.DB_USER }}
          IMAGE_TAG=latest
          EOF
          chmod 600 ${{ vars.DEPLOY_PATH }}/.env

      - name: Deploy with Docker Compose
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: |
          cp ${{ github.workspace }}/docker-compose.yml ./docker-compose.yml
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f

      - name: Health check
        run: |
          sleep 15
          STATUS=$(docker inspect --format='{{.State.Status}}' hh-assistant 2>/dev/null || echo "missing")
          echo "Container status: ${STATUS}"
          if [ "${STATUS}" != "running" ]; then
            docker logs --tail=100 hh-assistant || true
            exit 1
          fi
          # Проверяем health endpoint
          curl -sf http://localhost:8080/health/live || (docker logs --tail=50 hh-assistant && exit 1)
          echo "Deploy successful!"

      - name: Rollback note
        if: failure()
        run: |
          echo "Deploy failed. To rollback manually:"
          echo "  docker compose up -d --no-build (with previous image tag)"
