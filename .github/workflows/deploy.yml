name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Один деплой за раз — новый пуш отменяет предыдущий в очереди
concurrency:
  group: deploy-main
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# GitHub Secrets:   TELEGRAM_BOT_TOKEN
# GitHub Variables: DEPLOY_PATH  (например /opt/hh-assistant)
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ── Тесты (GitHub-hosted, не засоряет сервер) ─────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ── Деплой (self-hosted runner на сервере) ────────────────────────────────
  deploy:
    name: Deploy
    needs: test
    runs-on: [self-hosted, linux, x64]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure deploy path exists
        run: |
          set -euo pipefail
          mkdir -p "${DEPLOY_PATH}"

      - name: Sync project to deploy path
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".venv" \
            --exclude "__pycache__" \
            --exclude "*.pyc" \
            --exclude ".pytest_cache" \
            --exclude "*.egg-info" \
            --exclude "data/" \
            ./ "${DEPLOY_PATH}/"

      - name: Write .env
        run: |
          set -euo pipefail
          cat > "${DEPLOY_PATH}/.env" <<EOF
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          EOF
          chmod 600 "${DEPLOY_PATH}/.env"

      - name: Deploy with Docker Compose
        run: |
          set -euo pipefail
          cd "${DEPLOY_PATH}"
          docker compose up -d --build --remove-orphans
          docker image prune -f

      - name: Verify container is running
        run: |
          set -euo pipefail
          sleep 5
          STATUS=$(docker inspect --format='{{.State.Status}}' hh-assistant)
          echo "Container status: ${STATUS}"
          [ "${STATUS}" = "running" ] || (docker logs --tail=50 hh-assistant && exit 1)
